name: Code Quality Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  custom-checks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (includes TypeScript checks)
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Check for any types
        run: |
          echo "Checking for 'any' types..."
          if grep -r ":\s*any" src/ --include="*.ts" --include="*.tsx" | grep -v "//.*any"; then
            echo "❌ Found 'any' types. Please use proper type definitions."
            grep -r ":\s*any" src/ --include="*.ts" --include="*.tsx" | grep -v "//.*any"
            exit 1
          else
            echo "✅ No 'any' types found"
          fi

      - name: Check for missing prop interfaces
        run: |
          echo "Checking for components without prop interfaces..."
          # Find React components that might be missing prop interfaces
          find src/ packages/ -name "*.tsx" -exec grep -l "export.*function\|export.*const.*=" {} \; | \
          while read file; do
            if grep -q "interface.*Props\|type.*Props" "$file"; then
              echo "✅ $file has Props interface"
            else
              echo "⚠️  $file might be missing Props interface - manual review needed"
            fi
          done

      - name: Check custom hooks naming
        run: |
          echo "Checking custom hooks naming convention..."
          # Find custom hooks that don't start with 'use'
          find src/ packages/ -name "*.ts" -o -name "*.tsx" | \
          xargs grep -l "export.*function\|export.*const.*=" | \
          while read file; do
            if grep -q "use[A-Z]" "$file"; then
              # Check if any exported functions don't start with 'use'
              if grep -E "export.*function [^u]|export.*const [^u]" "$file" | grep -v "use[A-Z]"; then
                echo "⚠️  $file might have functions that should be hooks - manual review needed"
              fi
            fi
          done

      - name: Check file structure
        run: |
          echo "Checking file structure conventions..."
          
          # Check for components in wrong directories
          if find src/modules/ -name "*.tsx" -exec grep -l "export.*function\|export.*const.*=" {} \; | \
             xargs grep -l "Button\|Input\|Card\|Modal" 2>/dev/null; then
            echo "⚠️  Found potential UI components in modules/ - should be in packages/ui/"
          fi
          
          # Check for API files in wrong locations
          if find src/ -name "*.ts" -exec grep -l "api\|API" {} \; | \
             grep -v "src/apis/"; then
            echo "⚠️  Found potential API files outside src/apis/ - manual review needed"
          fi

      - name: Check import organization
        run: |
          echo "Checking import organization..."
          # This is mostly handled by ESLint, but we can add custom checks
          echo "✅ Import organization checked by ESLint"

      - name: Check for inline styles
        run: |
          echo "Checking for inline styles..."
          if grep -r "style=\{" src/ --include="*.tsx" | grep -v "//.*style="; then
            echo "⚠️  Found inline styles - consider using Tailwind classes"
            grep -r "style=\{" src/ --include="*.tsx" | grep -v "//.*style="
          else
            echo "✅ No inline styles found"
          fi

      - name: Check for missing dependency arrays
        run: |
          echo "Checking for missing useEffect dependency arrays..."
          if grep -r "useEffect.*=>" src/ --include="*.tsx" | grep -v "\[\]" | grep -v "//.*useEffect"; then
            echo "⚠️  Found useEffect without dependency array - manual review needed"
            grep -r "useEffect.*=>" src/ --include="*.tsx" | grep -v "\[\]" | grep -v "//.*useEffect"
          else
            echo "✅ All useEffect hooks have dependency arrays"
          fi

  bundle-analysis:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Analyze bundle size
        run: |
          echo "Bundle size analysis..."
          # Add bundle analysis tools here
          npm run analyze-bundle || echo "Bundle analysis not configured"

