name: 🎭 Playwright E2E Tests

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging URL to test'
        required: false
        default: 'https://app-stg-aws.zamp.ai'

env:
  NODE_ENV: test
  PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.inputs.staging_url || 'https://app-stg-aws.zamp.ai' }}

jobs:
  test:
    # Run after successful staging deployment OR manual trigger
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - run: |
        echo "🎭 Playwright tests triggered!"
        echo "Event: ${{ github.event_name }}"
        if [ "${{ github.event_name }}" == "deployment_status" ]; then
          echo "Environment: ${{ github.event.deployment.environment }}"
          echo "Deployment URL: ${{ github.event.deployment_status.environment_url }}"
          echo "SHA: ${{ github.event.deployment.sha }}"
        else
          echo "Manual trigger - Testing URL: ${{ env.PLAYWRIGHT_TEST_BASE_URL }}"
        fi
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}

    - name: Install dependencies
      run: |
          npm ci
          npx playwright install --with-deps

    - name: Create test directories
      run: |
        cd apps/application-dashboard
        mkdir -p tests/session-secrets
        touch tests/session-secrets/.gitkeep
        mkdir -p tests/test-results/videos
        chmod -R 777 tests/test-results tests/session-secrets
    
    - name: Run Playwright tests
      id: playwright-tests
      continue-on-error: true
      run: |
        cd apps/application-dashboard
        npx playwright test tests/specs --config=playwright.config.ts
      env:
        PLAYWRIGHT_JUNIT_OUTPUT_NAME: tests/test-results/junit.xml
        USE_LOCAL_SELENIUM: false
        PLAYWRIGHT_VIDEO_DIR: tests/test-results/videos

    - name: Publish test report
      if: always()
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: 'apps/application-dashboard/tests/test-results/junit.xml'
        check_name: Playwright Test Results
        fail_on_failure: false
        require_tests: false

    - name: Upload HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-html-report
        path: apps/application-dashboard/tests/playwright-report/
        retention-days: 30

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: apps/application-dashboard/tests/test-results/
        retention-days: 30

    - name: Prepare test summary
      id: test-summary
      if: always()
      run: |
          cd apps/application-dashboard
          # Check if result file exists
          if [[ -f tests/test-results/test-results.json ]]; then
            TEST_RESULTS=$(cat tests/test-results/test-results.json)
          else
            echo "No test result file found."
            TEST_RESULTS='{}'
          fi
          ACTOR="${{ github.actor }}"
          echo "$TEST_RESULTS" | node tests/scripts/playwright-pr-comment.js ${{ github.run_id }} ${{ github.repository }} "$ACTOR" > comment.md
          echo "comment<<EOF" >> $GITHUB_OUTPUT
          cat comment.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
    - name: Add PR comment
      if: always()
      uses: actions/github-script@v7
      with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = `${{ steps.test-summary.outputs.comment }}`;
            // Get PR number from context (PR) or via commit association (push)
            let prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                mediaType: { previews: ['groot'] },
              });
              prNumber = prs.data?.[0]?.number;
            }
            if (!prNumber) {
              console.log('No PR associated with this run; writing to job summary instead.');
              await core.summary.addRaw(comment).write();
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('## 🎭 Playwright Test Results')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment,
              });
            }