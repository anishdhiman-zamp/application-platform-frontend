name: Promote Beta to GA

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual release deploy'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  verify-git-sync:
    name: Verify no pending main → release sync PR
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - name: Check for open main → release sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          OPEN_SYNC=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --base release --head main --state open \
            --json number,url,title -q '.[0] // empty')
          if [ -n "$OPEN_SYNC" ]; then
            URL=$(echo "$OPEN_SYNC" | jq -r .url)
            TITLE=$(echo "$OPEN_SYNC" | jq -r .title)
            echo "::error::A main → release sync PR is open. Merge it before promoting:"
            echo "  $TITLE"
            echo "  $URL"
            exit 1
          fi
          echo "No open main → release sync PR — OK to promote."

  merge-release-to-main:
    name: Merge release → main
    needs:
      - verify-git-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@7bfa3a4717ef143a604ee0a99d859b8886a96d00 # v1.9.3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Merge release into main
        run: |
          git config user.email "224820880+zampactionbot[bot]@users.noreply.github.com"
          git config user.name "zampactionbot[bot]"
          git fetch origin main release
          git checkout main
          git merge origin/release --ff-only || {
            echo "::warning::Fast-forward merge failed. Creating merge commit."
            git merge origin/release --no-edit
          }
          git push origin main

      - name: Fast-forward release to main
        run: |
          git fetch origin main
          git checkout release
          git merge origin/main --ff-only
          git push origin release

  deploy:
    name: Deploy to Vercel (GA)
    needs:
      - merge-release-to-main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      duration: ${{ steps.duration.outputs.duration }}
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Record start time
        id: start
        run: echo "start=$EPOCHSECONDS" >> $GITHUB_OUTPUT

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "### Deployment successful!" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY

      - name: Compute duration
        id: duration
        if: always()
        run: |
          END=$EPOCHSECONDS
          START="${{ steps.start.outputs.start }}"
          ELAPSED=$(( END - ${START:-0} ))
          echo "duration=$(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s" >> $GITHUB_OUTPUT

  deploy-eu:
    name: Deploy to AWS EU
    if: needs.deploy.result == 'success'
    needs:
      - deploy
    uses: ./.github/workflows/aws-prd-eu-build-deploy.yaml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  slack-vercel:
    name: Slack Notification (Vercel)
    if: always()
    runs-on: ubuntu-latest
    needs:
      - verify-git-sync
      - merge-release-to-main
      - deploy
    steps:
      - name: Send notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_GA_DEPLOYMENTS }}
          RESULT: ${{ needs.deploy.result }}
          DURATION: ${{ needs.deploy.outputs.duration }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          BRANCH: 'main (manual)'
          AUTHOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_COMMIT="${COMMIT:0:7}"
          DURATION="${DURATION:-N/A}"
          if [ "$RESULT" == 'success' ]; then
            TITLE=":white_check_mark: Beta -> GA Promotion — Vercel"
            TEXT="Beta promoted to GA on Vercel successfully.\n*URL:* ${DEPLOYMENT_URL}"
          elif [ "$RESULT" == 'cancelled' ]; then
            TITLE=":grey_exclamation: Beta -> GA Promotion — Vercel cancelled"
            TEXT="Vercel promotion was cancelled."
          elif [ "$RESULT" == 'skipped' ]; then
            TITLE=":x: Beta -> GA Promotion — Vercel skipped"
            TEXT="Vercel promotion was skipped (git sync or merge step failed)."
          else
            TITLE=":x: Beta -> GA Promotion — Vercel failed"
            TEXT="Vercel promotion failed."
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg commit "$SHORT_COMMIT" \
            --arg duration "$DURATION" \
            --arg text "$TEXT" \
            --arg url "$RUN_URL" \
            '{blocks: [
              {type: "header", text: {type: "plain_text", text: $title}},
              {type: "section", fields: [
                {type: "mrkdwn", text: ("*Repo*\napplication-platform-frontend")},
                {type: "mrkdwn", text: ("*Branch*\n" + $branch)},
                {type: "mrkdwn", text: ("*Author*\n" + $author)},
                {type: "mrkdwn", text: ("*Commit*\n`" + $commit + "`")},
                {type: "mrkdwn", text: ("*Duration*\n" + $duration)}
              ]},
              {type: "section", text: {type: "mrkdwn", text: $text}},
              {type: "actions", elements: [{type: "button", text: {type: "plain_text", text: "View run"}, url: $url}]}
            ]}')
          curl -sf -X POST "$SLACK_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

  slack-eu:
    name: Slack Notification (AWS EU)
    if: always() && needs.deploy-eu.result != 'skipped'
    runs-on: ubuntu-latest
    needs:
      - deploy
      - deploy-eu
    steps:
      - name: Send notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_GA_DEPLOYMENTS }}
          RESULT: ${{ needs.deploy-eu.result }}
          DURATION: ${{ needs.deploy-eu.outputs.duration }}
          BRANCH: 'main (manual)'
          AUTHOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_COMMIT="${COMMIT:0:7}"
          DURATION="${DURATION:-N/A}"
          if [ "$RESULT" == 'success' ]; then
            TITLE=":white_check_mark: Beta -> GA Promotion — AWS EU"
            TEXT="Beta promoted to GA on AWS EU successfully."
          elif [ "$RESULT" == 'cancelled' ]; then
            TITLE=":grey_exclamation: Beta -> GA Promotion — AWS EU cancelled"
            TEXT="AWS EU deployment was cancelled."
          else
            TITLE=":x: Beta -> GA Promotion — AWS EU failed"
            TEXT="AWS EU deployment failed."
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg commit "$SHORT_COMMIT" \
            --arg duration "$DURATION" \
            --arg text "$TEXT" \
            --arg url "$RUN_URL" \
            '{blocks: [
              {type: "header", text: {type: "plain_text", text: $title}},
              {type: "section", fields: [
                {type: "mrkdwn", text: ("*Repo*\napplication-platform-frontend")},
                {type: "mrkdwn", text: ("*Branch*\n" + $branch)},
                {type: "mrkdwn", text: ("*Author*\n" + $author)},
                {type: "mrkdwn", text: ("*Commit*\n`" + $commit + "`")},
                {type: "mrkdwn", text: ("*Duration*\n" + $duration)}
              ]},
              {type: "section", text: {type: "mrkdwn", text: $text}},
              {type: "actions", elements: [{type: "button", text: {type: "plain_text", text: "View run"}, url: $url}]}
            ]}')
          curl -sf -X POST "$SLACK_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"
