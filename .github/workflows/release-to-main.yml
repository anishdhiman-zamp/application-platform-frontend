name: Promote Beta to GA

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual release deploy'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  verify-git-sync:
    name: Verify no pending main → release sync PR
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - name: Check for open main → release sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          OPEN_SYNC=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --base release --head main --state open \
            --json number,url,title -q '.[0] // empty')
          if [ -n "$OPEN_SYNC" ]; then
            URL=$(echo "$OPEN_SYNC" | jq -r .url)
            TITLE=$(echo "$OPEN_SYNC" | jq -r .title)
            echo "::error::A main → release sync PR is open. Merge it before promoting:"
            echo "  $TITLE"
            echo "  $URL"
            exit 1
          fi
          echo "No open main → release sync PR — OK to promote."

  merge-release-to-main:
    name: Merge release → main
    needs:
      - verify-git-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@7bfa3a4717ef143a604ee0a99d859b8886a96d00 # v1.9.3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Merge release into main
        run: |
          git config user.email "224820880+zampactionbot[bot]@users.noreply.github.com"
          git config user.name "zampactionbot[bot]"
          git fetch origin main release
          git checkout main
          git merge origin/release --ff-only || {
            echo "::warning::Fast-forward merge failed. Creating merge commit."
            git merge origin/release --no-edit
          }
          git push origin main

      - name: Fast-forward release to main
        run: |
          git fetch origin main
          git checkout release
          git merge origin/main --ff-only
          git push origin release

  deploy:
    name: Deploy to Vercel
    needs:
      - merge-release-to-main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      duration: ${{ steps.duration.outputs.duration }}
    steps:
      - name: Record start time
        id: start
        run: echo "start=$EPOCHSECONDS" >> $GITHUB_OUTPUT

      - name: Fetch latest beta deployment and promote to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          GA_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          RESPONSE=$(curl -sf \
            "https://api.vercel.com/v6/deployments?projectId=${GA_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=beta&state=READY&limit=1" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")

          BETA_DEPLOYMENT_ID=$(echo "$RESPONSE" | jq -r '.deployments[0].uid')
          BETA_DEPLOYMENT_URL=$(echo "$RESPONSE" | jq -r '.deployments[0].url')
          BETA_COMMIT=$(echo "$RESPONSE" | jq -r '.deployments[0].meta.githubCommitSha // empty')

          if [ -z "$BETA_DEPLOYMENT_ID" ] || [ "$BETA_DEPLOYMENT_ID" == "null" ]; then
            echo "ERROR: Could not find a ready beta deployment to promote."
            echo "API response: $RESPONSE"
            exit 1
          fi

          if [ -z "$BETA_COMMIT" ]; then
            echo "ERROR: Beta deployment has no githubCommitSha metadata; cannot verify SHA. Failing to be safe."
            exit 1
          fi

          echo "INFO: Triggered via workflow_dispatch — SHA verification skipped. Beta deployment SHA: $BETA_COMMIT"

          echo "Found beta deployment: $BETA_DEPLOYMENT_ID ($BETA_DEPLOYMENT_URL)"
          echo "Promoting to production..."

          PROMOTE_RESPONSE=$(curl -s -w "\n__HTTP_STATUS__%{http_code}" -X POST \
            "https://api.vercel.com/v10/projects/${GA_PROJECT_ID}/promote/${BETA_DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{}")

          HTTP_STATUS=$(echo "$PROMOTE_RESPONSE" | grep '__HTTP_STATUS__' | sed 's/__HTTP_STATUS__//')
          PROMOTE_RESPONSE=$(echo "$PROMOTE_RESPONSE" | grep -v '__HTTP_STATUS__')
          echo "Promote API HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 409 ]; then
            echo "Deployment is already the current production deployment — treating as success."
          elif [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: Promote API returned HTTP $HTTP_STATUS"
            echo "Response: $PROMOTE_RESPONSE"
            exit 1
          fi

          DEPLOYMENT_URL=$(echo "$PROMOTE_RESPONSE" | jq -r '.url // .deployment.url // empty')
          if [ -z "$DEPLOYMENT_URL" ]; then
            DEPLOYMENT_URL="$BETA_DEPLOYMENT_URL"
          fi

          echo "deployment_url=https://$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "beta_deployment_id=$BETA_DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          echo "### Promotion successful!" >> $GITHUB_STEP_SUMMARY
          echo "**Beta deployment:** $BETA_DEPLOYMENT_ID" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://$DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY

      - name: Compute duration
        id: duration
        if: always()
        run: |
          END=$EPOCHSECONDS
          START="${{ steps.start.outputs.start }}"
          ELAPSED=$(( END - ${START:-0} ))
          echo "duration=$(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s" >> $GITHUB_OUTPUT

  deploy-eu:
    name: Deploy to AWS EU
    if: needs.deploy.result == 'success'
    needs:
      - deploy
    uses: ./.github/workflows/aws-prd-eu-build-deploy.yaml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  slack-vercel:
    name: Slack Notification (Vercel)
    if: always()
    runs-on: ubuntu-latest
    needs:
      - verify-git-sync
      - merge-release-to-main
      - deploy
    steps:
      - name: Send notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_GA_DEPLOYMENTS }}
          RESULT: ${{ needs.deploy.result }}
          DURATION: ${{ needs.deploy.outputs.duration }}
          BRANCH: 'main (manual)'
          AUTHOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_COMMIT="${COMMIT:0:7}"
          DURATION="${DURATION:-N/A}"
          if [ "$RESULT" == 'success' ]; then
            TITLE=":white_check_mark: Beta -> GA Promotion — Vercel"
            TEXT="Beta promoted to GA on Vercel successfully."
          elif [ "$RESULT" == 'cancelled' ]; then
            TITLE=":grey_exclamation: Beta -> GA Promotion — Vercel cancelled"
            TEXT="Vercel promotion was cancelled."
          elif [ "$RESULT" == 'skipped' ]; then
            TITLE=":x: Beta -> GA Promotion — Vercel skipped"
            TEXT="Vercel promotion was skipped (git sync or merge step failed)."
          else
            TITLE=":x: Beta -> GA Promotion — Vercel failed"
            TEXT="Vercel promotion failed."
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg commit "$SHORT_COMMIT" \
            --arg duration "$DURATION" \
            --arg text "$TEXT" \
            --arg url "$RUN_URL" \
            '{blocks: [
              {type: "header", text: {type: "plain_text", text: $title}},
              {type: "section", fields: [
                {type: "mrkdwn", text: ("*Repo*\napplication-platform-frontend")},
                {type: "mrkdwn", text: ("*Branch*\n" + $branch)},
                {type: "mrkdwn", text: ("*Author*\n" + $author)},
                {type: "mrkdwn", text: ("*Commit*\n`" + $commit + "`")},
                {type: "mrkdwn", text: ("*Duration*\n" + $duration)}
              ]},
              {type: "section", text: {type: "mrkdwn", text: $text}},
              {type: "actions", elements: [{type: "button", text: {type: "plain_text", text: "View run"}, url: $url}]}
            ]}')
          curl -sf -X POST "$SLACK_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

  slack-eu:
    name: Slack Notification (AWS EU)
    if: always() && needs.deploy-eu.result != 'skipped'
    runs-on: ubuntu-latest
    needs:
      - deploy
      - deploy-eu
    steps:
      - name: Send notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_GA_DEPLOYMENTS }}
          RESULT: ${{ needs.deploy-eu.result }}
          DURATION: ${{ needs.deploy-eu.outputs.duration }}
          BRANCH: 'main (manual)'
          AUTHOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_COMMIT="${COMMIT:0:7}"
          DURATION="${DURATION:-N/A}"
          if [ "$RESULT" == 'success' ]; then
            TITLE=":white_check_mark: Beta -> GA Promotion — AWS EU"
            TEXT="Beta promoted to GA on AWS EU successfully."
          elif [ "$RESULT" == 'cancelled' ]; then
            TITLE=":grey_exclamation: Beta -> GA Promotion — AWS EU cancelled"
            TEXT="AWS EU deployment was cancelled."
          else
            TITLE=":x: Beta -> GA Promotion — AWS EU failed"
            TEXT="AWS EU deployment failed."
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg commit "$SHORT_COMMIT" \
            --arg duration "$DURATION" \
            --arg text "$TEXT" \
            --arg url "$RUN_URL" \
            '{blocks: [
              {type: "header", text: {type: "plain_text", text: $title}},
              {type: "section", fields: [
                {type: "mrkdwn", text: ("*Repo*\napplication-platform-frontend")},
                {type: "mrkdwn", text: ("*Branch*\n" + $branch)},
                {type: "mrkdwn", text: ("*Author*\n" + $author)},
                {type: "mrkdwn", text: ("*Commit*\n`" + $commit + "`")},
                {type: "mrkdwn", text: ("*Duration*\n" + $duration)}
              ]},
              {type: "section", text: {type: "mrkdwn", text: $text}},
              {type: "actions", elements: [{type: "button", text: {type: "plain_text", text: "View run"}, url: $url}]}
            ]}')
          curl -sf -X POST "$SLACK_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"
