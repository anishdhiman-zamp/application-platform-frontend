name: Hotfix Deploy to GA

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual hotfix deploy'
        required: true
        type: string

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      duration: ${{ steps.duration.outputs.duration }}
    steps:
      - name: Record start time
        id: start
        run: echo "start=$EPOCHSECONDS" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "### Deployment successful!" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY

      - name: Compute duration
        id: duration
        if: always()
        run: |
          END=$EPOCHSECONDS
          ELAPSED=$(( END - ${{ steps.start.outputs.start }} ))
          echo "duration=$(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s" >> $GITHUB_OUTPUT

  deploy-eu:
    name: Deploy to AWS EU
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'hotfix/'))) &&
      needs.deploy.result == 'success'
    needs:
      - deploy
    uses: ./.github/workflows/aws-prd-eu-build-deploy.yaml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  slack-vercel:
    name: Slack Notification (Vercel)
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'hotfix/')))
    runs-on: ubuntu-latest
    needs:
      - deploy
    steps:
      - name: Send notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_GA_DEPLOYMENTS }}
          RESULT: ${{ needs.deploy.result }}
          DURATION: ${{ needs.deploy.outputs.duration }}
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && 'main (manual)' || github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_COMMIT="${COMMIT:0:7}"
          if [ "$RESULT" == 'success' ]; then
            TITLE=":white_check_mark: Hotfix Deployment — Vercel"
            TEXT="Hotfix deployed to production on Vercel successfully."
          elif [ "$RESULT" == 'cancelled' ]; then
            TITLE=":grey_exclamation: Hotfix Deployment — Vercel cancelled"
            TEXT="Vercel deployment was cancelled."
          else
            TITLE=":x: Hotfix Deployment — Vercel failed"
            TEXT="Vercel deployment failed."
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg commit "$SHORT_COMMIT" \
            --arg duration "$DURATION" \
            --arg text "$TEXT" \
            --arg url "$RUN_URL" \
            '{blocks: [
              {type: "header", text: {type: "plain_text", text: $title}},
              {type: "section", fields: [
                {type: "mrkdwn", text: ("*Repo*\napplication-platform-frontend")},
                {type: "mrkdwn", text: ("*Branch*\n" + $branch)},
                {type: "mrkdwn", text: ("*Author*\n" + $author)},
                {type: "mrkdwn", text: ("*Commit*\n`" + $commit + "`")},
                {type: "mrkdwn", text: ("*Duration*\n" + $duration)}
              ]},
              {type: "section", text: {type: "mrkdwn", text: $text}},
              {type: "actions", elements: [{type: "button", text: {type: "plain_text", text: "View run"}, url: $url}]}
            ]}')
          curl -sf -X POST "$SLACK_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

  slack-eu:
    name: Slack Notification (AWS EU)
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'hotfix/'))) &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - deploy
      - deploy-eu
    steps:
      - name: Send notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_GA_DEPLOYMENTS }}
          RESULT: ${{ needs.deploy-eu.result }}
          DURATION: ${{ needs.deploy-eu.outputs.duration }}
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && 'main (manual)' || github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_COMMIT="${COMMIT:0:7}"
          DURATION="${DURATION:-N/A}"
          if [ "$RESULT" == 'success' ]; then
            TITLE=":white_check_mark: Hotfix Deployment — AWS EU"
            TEXT="Hotfix deployed to production on AWS EU successfully."
          elif [ "$RESULT" == 'cancelled' ]; then
            TITLE=":grey_exclamation: Hotfix Deployment — AWS EU cancelled"
            TEXT="AWS EU deployment was cancelled."
          else
            TITLE=":x: Hotfix Deployment — AWS EU failed"
            TEXT="AWS EU deployment failed."
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg commit "$SHORT_COMMIT" \
            --arg duration "$DURATION" \
            --arg text "$TEXT" \
            --arg url "$RUN_URL" \
            '{blocks: [
              {type: "header", text: {type: "plain_text", text: $title}},
              {type: "section", fields: [
                {type: "mrkdwn", text: ("*Repo*\napplication-platform-frontend")},
                {type: "mrkdwn", text: ("*Branch*\n" + $branch)},
                {type: "mrkdwn", text: ("*Author*\n" + $author)},
                {type: "mrkdwn", text: ("*Commit*\n`" + $commit + "`")},
                {type: "mrkdwn", text: ("*Duration*\n" + $duration)}
              ]},
              {type: "section", text: {type: "mrkdwn", text: $text}},
              {type: "actions", elements: [{type: "button", text: {type: "plain_text", text: "View run"}, url: $url}]}
            ]}')
          curl -sf -X POST "$SLACK_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"
