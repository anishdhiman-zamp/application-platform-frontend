name: Hotfix Deploy to GA

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual hotfix deploy'
        required: true
        type: string

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "### Deployment successful!" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY

  deploy-eu:
    name: Deploy to AWS EU
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    uses: ./.github/workflows/aws-prd-eu-build-deploy.yaml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  slack-notification:
    name: Slack Notification
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'hotfix/')))
    runs-on: ubuntu-latest
    needs:
      - deploy
      - deploy-eu
    steps:
      - uses: technote-space/workflow-conclusion-action@v3
      - name: Update slack message body
        id: body
        run: |
          DEPLOY_RESULT="${{ needs.deploy.result }}"
          EU_RESULT="${{ needs.deploy-eu.result }}"

          if [ "${{ github.event_name }}" == 'workflow_dispatch' ]; then
            BRANCH="main (manual)"
            REASON=" | Reason: ${{ github.event.inputs.reason }}"
            TRIGGERED_BY=" | Triggered by: ${{ github.actor }}"
          else
            BRANCH="${{ github.event.pull_request.head.ref }}"
            REASON=""
            TRIGGERED_BY=""
          fi

          if [ "$DEPLOY_RESULT" == 'failure' ]; then
            echo "SLACK_MESSAGE=Vercel Deploy Failed :x: | Branch: ${BRANCH}${REASON}${TRIGGERED_BY}" >> $GITHUB_OUTPUT
          elif [ "$EU_RESULT" == 'failure' ]; then
            echo "SLACK_MESSAGE=AWS EU Deploy Failed :x: | Branch: ${BRANCH} | Vercel passed but EU deployment failed${REASON}${TRIGGERED_BY}" >> $GITHUB_OUTPUT
          elif [ "${{ env.WORKFLOW_CONCLUSION }}" == 'success' ]; then
            echo "SLACK_MESSAGE=Hotfix Deployment Success :white_check_mark: | Branch: ${BRANCH} | Vercel + AWS EU${REASON}${TRIGGERED_BY}" >> $GITHUB_OUTPUT
          elif [ "${{ env.WORKFLOW_CONCLUSION }}" == 'cancelled' ]; then
            echo "SLACK_MESSAGE=Hotfix Deployment Cancelled :grey_exclamation: | Branch: ${BRANCH}${REASON}${TRIGGERED_BY}" >> $GITHUB_OUTPUT
          else
            echo "SLACK_MESSAGE=Hotfix Deployment Failed :x: | Branch: ${BRANCH}${REASON}${TRIGGERED_BY}" >> $GITHUB_OUTPUT
          fi
      - name: Slack Notification
        uses: Zampfi/town_crier@main
        env:
          SLACK_COLOR: ${{ env.WORKFLOW_CONCLUSION }}
          SLACK_ICON: https://media-exp1.licdn.com/dms/image/C4D0BAQEsXCky1jDBjw/company-logo_200_200/0/1650191766210?e=2147483647&v=beta&t=skUuL49MkcdxJZmEEN2wy5E7Xqy176Ar7EPsKoSMUEE
          SLACK_MESSAGE: ${{ steps.body.outputs.SLACK_MESSAGE }}
          SLACK_TITLE: Production Deployment
          ZAMP_ENV: production
          SLACK_FOOTER: '<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>'
          SLACK_USERNAME: Zamp-Devops
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_APPLICATION_PLATFORM_FRONTEND }}
