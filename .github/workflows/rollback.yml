name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'What to roll back'
        required: true
        type: choice
        options:
          - vercel-and-eu
          - vercel-only
          - eu-only
      eu_rollback_ref:
        description: 'Git SHA or tag for AWS EU rollback (required when targets includes eu)'
        required: false
        type: string
      reason:
        description: 'Reason for rollback (shown in Slack)'
        required: true
        type: string

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

concurrency:
  group: rollback
  cancel-in-progress: false

jobs:
  rollback-vercel:
    name: Rollback Vercel (instant)
    if: inputs.targets != 'eu-only'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@35

      - name: Rollback to previous deployment
        id: rollback
        run: |
          vercel rollback --yes --token=${{ secrets.VERCEL_TOKEN }}
          echo "### Vercel rolled back to previous deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** ${{ inputs.reason }}" >> $GITHUB_STEP_SUMMARY

  validate-eu-ref:
    name: Validate EU rollback ref
    if: inputs.targets != 'vercel-only' && inputs.eu_rollback_ref == ''
    runs-on: ubuntu-latest
    steps:
      - name: Fail if eu_rollback_ref is missing
        run: |
          echo "::error::eu_rollback_ref is required when targets includes EU"
          exit 1

  rollback-eu:
    name: Rollback AWS EU
    if: inputs.targets != 'vercel-only'
    needs: validate-eu-ref
    uses: ./.github/workflows/aws-prd-eu-build-deploy.yaml
    with:
      ref: ${{ inputs.eu_rollback_ref }}
    secrets: inherit

  slack-notification:
    name: Slack Notification
    if: always()
    runs-on: ubuntu-latest
    needs:
      - rollback-vercel
      - validate-eu-ref
      - rollback-eu
    steps:
      - uses: technote-space/workflow-conclusion-action@v3
      - name: Build message
        id: body
        run: |
          VERCEL_RESULT="${{ needs.rollback-vercel.result }}"
          EU_RESULT="${{ needs.rollback-eu.result }}"
          TARGETS="${{ inputs.targets }}"
          EU_REF="${{ inputs.eu_rollback_ref }}"
          REASON="${{ inputs.reason }}"

          if [ "${{ env.WORKFLOW_CONCLUSION }}" == "success" ]; then
            echo "SLACK_MESSAGE=Rollback Success :white_check_mark: | Targets: ${TARGETS} | EU ref: ${EU_REF:-n/a} | Reason: ${REASON}" >> $GITHUB_OUTPUT
          elif [ "${{ env.WORKFLOW_CONCLUSION }}" == "failure" ]; then
            echo "SLACK_MESSAGE=Rollback Failed :x: | Targets: ${TARGETS} | Reason: ${REASON} | Vercel: ${VERCEL_RESULT} | EU: ${EU_RESULT}" >> $GITHUB_OUTPUT
          else
            echo "SLACK_MESSAGE=Rollback Cancelled :grey_exclamation: | Targets: ${TARGETS}" >> $GITHUB_OUTPUT
          fi

      - name: Slack Notification
        uses: Zampfi/town_crier@main
        env:
          SLACK_COLOR: ${{ env.WORKFLOW_CONCLUSION }}
          SLACK_ICON: https://media-exp1.licdn.com/dms/image/C4D0BAQEsXCky1jDBjw/company-logo_200_200/0/1650191766210?e=2147483647&v=beta&t=skUuL49MkcdxJZmEEN2wy5E7Xqy176Ar7EPsKoSMUEE
          SLACK_MESSAGE: ${{ steps.body.outputs.SLACK_MESSAGE }}
          SLACK_TITLE: Production Rollback
          ZAMP_ENV: production
          SLACK_FOOTER: '<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>'
          SLACK_USERNAME: Zamp-Devops
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_APPLICATION_PLATFORM_FRONTEND }}
