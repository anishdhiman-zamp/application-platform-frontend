name: Deploy to Beta

on:
  pull_request:
    branches:
      - release
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_RELEASE }}

jobs:
  deploy:
    name: Deploy to Vercel
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    outputs:
      duration: ${{ steps.duration.outputs.duration }}
    steps:
      - name: Record start time
        id: start
        run: echo "start=$EPOCHSECONDS" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=beta --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "### Beta Deployment successful!" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with deployment URL
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- vercel-deployment-comment -->';
            const body = `${marker}\n### Beta Deployment Ready!\n\n**URL:** ${{ steps.deploy.outputs.deployment_url }}\n\nDeployed successfully via GitHub Actions`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.find(comment => comment.body.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Compute duration
        id: duration
        if: always()
        run: |
          END=$EPOCHSECONDS
          START="${{ steps.start.outputs.start }}"
          ELAPSED=$(( END - ${START:-0} ))
          echo "duration=$(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s" >> $GITHUB_OUTPUT

  slack-vercel:
    name: Slack Notification (Vercel)
    if: always() && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs:
      - deploy
    steps:
      - name: Send notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_APPLICATION_PLATFORM_FRONTEND }}
          RESULT: ${{ needs.deploy.result }}
          DURATION: ${{ needs.deploy.outputs.duration }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_COMMIT="${COMMIT:0:7}"
          DURATION="${DURATION:-N/A}"
          if [ "$RESULT" == 'success' ]; then
            TITLE=":white_check_mark: Beta Deployment — Vercel"
            TEXT="Beta deployed on Vercel successfully."
          elif [ "$RESULT" == 'cancelled' ]; then
            TITLE=":grey_exclamation: Beta Deployment — Vercel cancelled"
            TEXT="Vercel deployment was cancelled."
          else
            TITLE=":x: Beta Deployment — Vercel failed"
            TEXT="Vercel deployment failed."
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg commit "$SHORT_COMMIT" \
            --arg duration "$DURATION" \
            --arg text "$TEXT" \
            --arg url "$RUN_URL" \
            '{blocks: [
              {type: "header", text: {type: "plain_text", text: $title}},
              {type: "section", fields: [
                {type: "mrkdwn", text: ("*Repo*\napplication-platform-frontend")},
                {type: "mrkdwn", text: ("*Branch*\n" + $branch)},
                {type: "mrkdwn", text: ("*Author*\n" + $author)},
                {type: "mrkdwn", text: ("*Commit*\n`" + $commit + "`")},
                {type: "mrkdwn", text: ("*Duration*\n" + $duration)}
              ]},
              {type: "section", text: {type: "mrkdwn", text: $text}},
              {type: "actions", elements: [{type: "button", text: {type: "plain_text", text: "View run"}, url: $url}]}
            ]}')
          curl -sf -X POST "$SLACK_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"
