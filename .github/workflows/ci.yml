name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests with coverage
      run: npm run test
      env:
        CI: true
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 14
    
    - name: Display coverage summary
      run: |
        echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "Coverage report has been uploaded as an artifact." >> $GITHUB_STEP_SUMMARY
        echo "You can download the full report from the artifacts section." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Coverage files:" >> $GITHUB_STEP_SUMMARY
        if [ -f "coverage/lcov.info" ]; then
          echo "- LCOV Report: coverage/lcov.info" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f "coverage/coverage-final.json" ]; then
          echo "- JSON Report: coverage/coverage-final.json" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -d "coverage/lcov-report" ]; then
          echo "- HTML Report: coverage/lcov-report/index.html" >> $GITHUB_STEP_SUMMARY
        fi

 