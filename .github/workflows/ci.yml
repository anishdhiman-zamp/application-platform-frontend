name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linting
      run: npm run lint
    
    - name: Run tests with coverage
      run: npm test -- --coverage
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 14
    
    - name: Display coverage summary
      run: |
        echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "Coverage report has been uploaded as an artifact." >> $GITHUB_STEP_SUMMARY
        echo "You can download the full report from the artifacts section." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Coverage files:" >> $GITHUB_STEP_SUMMARY
        ls -la coverage/ >> $GITHUB_STEP_SUMMARY

  enforce-pr-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Check PR Review Status
      uses: actions/github-script@v7
      with:
        script: |
          const { data: reviews } = await github.rest.pulls.listReviews({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          
          const teamMembers = await github.rest.teams.listMembers({
            org: context.repo.owner,
            team_slug: 'application-platform-frontend'
          });
          
          const teamMemberLogins = teamMembers.data.map(member => member.login);
          const hasTeamReview = reviews.some(review => 
            teamMemberLogins.includes(review.user.login) && 
            review.state === 'APPROVED'
          );
          
          if (!hasTeamReview) {
            core.setFailed('This PR requires approval from a member of @ZampFi/application-platform-frontend team');
          } 