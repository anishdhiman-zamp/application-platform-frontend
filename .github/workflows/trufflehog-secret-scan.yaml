name: TruffleHog Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, development, staging]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        env:
          TRUFFLEHOG_VERSION: "3.93.8"
        run: |
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
            | tar xzf - -C /usr/local/bin trufflehog
          trufflehog --version

      - name: Run TruffleHog Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          SCAN_ARGS=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            echo "PR scan: scanning $PR_BASE_SHA..$PR_HEAD_SHA"
            SCAN_ARGS="--since-commit=$PR_BASE_SHA --branch=$PR_HEAD_SHA"
          else
            echo "Full scan: scanning all history"
          fi

          set +e
          trufflehog git file://./ \
            --results=verified,unknown,unverified \
            --json \
            --no-update \
            $SCAN_ARGS \
            > trufflehog_results.jsonl 2>trufflehog_stderr.log
          SCAN_EXIT=$?
          set -e

          echo "TruffleHog exit code: $SCAN_EXIT"
          if [ "$SCAN_EXIT" -ne 0 ] && [ "$SCAN_EXIT" -ne 183 ]; then
            echo "::error::TruffleHog failed with unexpected exit code $SCAN_EXIT"
            cat trufflehog_stderr.log
            exit 1
          fi
          FINDING_COUNT=$(wc -l < trufflehog_results.jsonl | tr -d ' ')
          echo "Raw findings: $FINDING_COUNT"

      - name: Process Results and Check Waivers
        id: process
        run: |
          cat << 'PYTHON_SCRIPT' > _process_trufflehog.py
          import json
          import os
          import fnmatch
          from datetime import datetime, timedelta

          EXPIRATION_DATE = (datetime.now() + timedelta(days=365)).strftime("%Y-%m-%d")

          def load_jsonl(path):
              findings = []
              try:
                  with open(path) as f:
                      for line in f:
                          line = line.strip()
                          if line:
                              findings.append(json.loads(line))
              except FileNotFoundError:
                  pass
              return findings

          def load_waivers(path):
              try:
                  with open(path) as f:
                      data = json.load(f)
                  waivers = data.get("waivers", [])
                  valid = []
                  for w in waivers:
                      expires = w.get("expires", "")
                      if expires:
                          try:
                              if datetime.strptime(expires, "%Y-%m-%d") < datetime.now():
                                  print(f"  Waiver expired: {w.get('detector')} in {w.get('file_path')}")
                                  continue
                          except ValueError:
                              pass
                      valid.append(w)
                  return valid
              except (FileNotFoundError, json.JSONDecodeError):
                  return []

          def _has_ignore_marker(line_text, detector_name):
              if "trufflehog:ignore" not in line_text:
                  return False
              rest = line_text.split("trufflehog:ignore", 1)[1].strip()
              return not rest or rest.startswith(detector_name)

          def check_inline_ignore(file_path, line_num, detector_name, raw_secret=""):
              """Check for trufflehog:ignore using reported line AND raw secret search."""
              try:
                  with open(file_path) as f:
                      lines = f.readlines()
              except (FileNotFoundError, UnicodeDecodeError):
                  return False

              # Strategy 1: check at TruffleHog's reported line number
              for idx in [line_num - 1, line_num - 2]:
                  if 0 <= idx < len(lines) and _has_ignore_marker(lines[idx], detector_name):
                      return True

              # Strategy 2: find the line containing the raw secret value,
              # then check that line and the line above for the ignore marker.
              # Handles cases where TruffleHog reports inaccurate line numbers
              # from git diff scanning.
              if raw_secret and len(raw_secret) >= 8:
                  needle = raw_secret[:40]
                  for i, line in enumerate(lines):
                      if needle in line:
                          if _has_ignore_marker(line, detector_name):
                              return True
                          if i > 0 and _has_ignore_marker(lines[i - 1], detector_name):
                              return True
              return False

          def check_file_waivers(detector, file_path, redacted, waivers):
              for w in waivers:
                  w_detector = w.get("detector", "")
                  w_file = w.get("file_path", "")
                  w_secret = w.get("secret", "")

                  if not w_detector and not w_file:
                      continue

                  if w_detector and w_detector != detector:
                      continue

                  if w_file and not fnmatch.fnmatch(file_path, w_file):
                      continue

                  if w_secret and w_secret != redacted:
                      continue

                  return w
              return None

          def extract_fields(finding):
              git = finding.get("SourceMetadata", {}).get("Data", {}).get("Git", {})
              return {
                  "file": git.get("file", ""),
                  "line": git.get("line", 0),
                  "commit": git.get("commit", "")[:8],
                  "detector": finding.get("DetectorName", "Unknown"),
                  "verified": finding.get("Verified", None),
                  "redacted": finding.get("Redacted", ""),
                  "raw": finding.get("Raw", ""),
                  "raw_detector_type": finding.get("DetectorType", 0),
              }

          def verification_label(verified):
              if verified is True:
                  return "VERIFIED ACTIVE"
              if verified is False:
                  return "Inactive"
              return "Unknown (verification failed)"

          def write_report(blocking, waived_inline, waived_file, total):
              with open("TRUFFLEHOG_REPORT.md", "w") as f:
                  f.write("# TruffleHog Secret Scan Report\n\n")
                  f.write(f"| Metric | Count |\n|---|---|\n")
                  f.write(f"| Total findings | {total} |\n")
                  f.write(f"| Blocking | {len(blocking)} |\n")
                  f.write(f"| Waived (inline) | {len(waived_inline)} |\n")
                  f.write(f"| Waived (file) | {len(waived_file)} |\n\n")

                  if blocking:
                      f.write("## Blocking Findings\n\n")
                      for info in blocking:
                          f.write(f"### {info['detector']}\n")
                          f.write(f"- **File:** `{info['file']}:{info['line']}`\n")
                          f.write(f"- **Status:** {verification_label(info['verified'])}\n")
                          f.write(f"- **Secret:** `{info['redacted']}`\n")
                          f.write(f"- **Commit:** `{info['commit']}`\n\n")

                          f.write("<details><summary>How to waive this finding</summary>\n\n")
                          f.write("**Option 1 -- Inline comment** (recommended, moves with code):\n")
                          f.write("```\n")
                          f.write(f"your_code_here  # trufflehog:ignore\n")
                          f.write("```\n")
                          f.write("Or on the line above:\n")
                          f.write("```\n")
                          f.write(f"# trufflehog:ignore\n")
                          f.write(f"your_code_here\n")
                          f.write("```\n\n")

                          f.write("**Option 2 -- `.trufflehog-waivers.json`** (for generated/non-editable files):\n")
                          f.write("```json\n")
                          waiver_obj = {
                              "detector": info["detector"],
                              "file_path": info["file"],
                              "secret": info["redacted"],
                              "reason": "<justification>",
                              "expires": EXPIRATION_DATE,
                              "approved_by": "<your email>"
                          }
                          f.write(json.dumps({"waivers": [waiver_obj]}, indent=2))
                          f.write("\n```\n")
                          f.write("</details>\n\n---\n\n")
                  else:
                      f.write("## No Blocking Findings\n\n")
                      f.write("All clear -- no unwaived secrets detected.\n")

          # ---- main ----
          findings = load_jsonl("trufflehog_results.jsonl")
          waivers = load_waivers(".trufflehog-waivers.json")

          blocking = []
          waived_inline = []
          waived_file = []

          for finding in findings:
              info = extract_fields(finding)

              if check_inline_ignore(info["file"], info["line"], info["detector"], info.get("raw", "")):
                  waived_inline.append(info)
                  print(f"  Inline waiver: {info['detector']} at {info['file']}:{info['line']}")
                  continue

              matched_waiver = check_file_waivers(info["detector"], info["file"], info["redacted"], waivers)
              if matched_waiver:
                  waived_file.append(info)
                  reason = matched_waiver.get("reason", "no reason given")
                  print(f"  File waiver: {info['detector']} at {info['file']} ({reason})")
                  continue

              blocking.append(info)

          write_report(blocking, waived_inline, waived_file, len(findings))

          print(f"\nResults: {len(blocking)} blocking, {len(waived_inline)} inline-waived, {len(waived_file)} file-waived")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"blocking_count={len(blocking)}\n")
              f.write(f"total_findings={len(findings)}\n")

          PYTHON_SCRIPT

          python3 _process_trufflehog.py

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.process.outputs.total_findings != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('TRUFFLEHOG_REPORT.md', 'utf8');
            const blockingCount = '${{ steps.process.outputs.blocking_count }}';

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('TruffleHog Secret Scan Report')
            );

            const body = `## TruffleHog Secret Scan: ${blockingCount} blocking finding(s)\n\n` + report;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report-${{ github.run_number }}
          path: |
            TRUFFLEHOG_REPORT.md
            trufflehog_stderr.log
          retention-days: 30

      - name: Fail on Unwaived Secrets
        if: steps.process.outputs.blocking_count != '0'
        run: |
          echo "::error::${{ steps.process.outputs.blocking_count }} unwaived secret(s) detected. See PR comment for waiver instructions."
          exit 1
