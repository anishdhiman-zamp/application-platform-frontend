name: Hotfix Sync (main → release)

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

permissions:
  contents: read
  pull-requests: write

jobs:
  create-sync-pr:
    name: Create main → release sync PR
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    outputs:
      pr_url: ${{ steps.create-pr.outputs.pr_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create sync PR
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOTFIX_BRANCH: ${{ github.head_ref }}
          HOTFIX_PR_NUMBER: ${{ github.event.pull_request.number }}
          HOTFIX_SHA: ${{ github.sha }}
        run: |
          PR_URL=$(gh pr create \
            --base release \
            --head main \
            --title "chore: sync main → release after hotfix ${HOTFIX_BRANCH}" \
            --body "## Hotfix Sync

          This PR was automatically created to sync \`main\` back into \`release\` after a hotfix was merged.

          **Originating hotfix PR:** #${HOTFIX_PR_NUMBER} (\`${HOTFIX_BRANCH}\`)
          **Commit SHA:** \`${HOTFIX_SHA}\`

          Please review and merge to keep \`release\` in sync with \`main\`." \
          )
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "Sync PR created: $PR_URL" >> $GITHUB_STEP_SUMMARY

  slack-notification:
    name: Slack Notification
    if: always()
    runs-on: ubuntu-latest
    needs: create-sync-pr
    steps:
      - name: Build message
        id: body
        run: |
          RESULT="${{ needs.create-sync-pr.result }}"
          HOTFIX_BRANCH="${{ github.head_ref }}"
          PR_URL="${{ needs.create-sync-pr.outputs.pr_url }}"

          if [ "$RESULT" == "success" ]; then
            echo "SLACK_MESSAGE=Hotfix sync PR created :white_check_mark: | Branch: ${HOTFIX_BRANCH} | Review required: ${PR_URL}" >> $GITHUB_OUTPUT
          elif [ "$RESULT" == "skipped" ]; then
            exit 0
          else
            echo "SLACK_MESSAGE=Hotfix sync PR creation failed :x: | Branch: ${HOTFIX_BRANCH} | Check Actions for details" >> $GITHUB_OUTPUT
          fi

      - name: Slack Notification
        if: needs.create-sync-pr.result != 'skipped'
        uses: Zampfi/town_crier@main
        env:
          SLACK_COLOR: ${{ needs.create-sync-pr.result }}
          SLACK_ICON: https://media-exp1.licdn.com/dms/image/C4D0BAQEsXCky1jDBjw/company-logo_200_200/0/1650191766210?e=2147483647&v=beta&t=skUuL49MkcdxJZmEEN2wy5E7Xqy176Ar7EPsKoSMUEE
          SLACK_MESSAGE: ${{ steps.body.outputs.SLACK_MESSAGE }}
          SLACK_TITLE: Hotfix Sync - Action Required
          ZAMP_ENV: production
          SLACK_FOOTER: '<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>'
          SLACK_USERNAME: Zamp-Devops
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_APPLICATION_PLATFORM_FRONTEND }}
